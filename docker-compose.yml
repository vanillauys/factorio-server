# Factorio game server + a web file manager on one shared volume.
#
# - The game speaks UDP on 34197. Traefik cannot route it; Docker
#   publishes the port directly on the host.
# - files (dufs) gives browser access to /factorio (saves, mods,
#   config). Dokploy routes https://factorio.vanillauys.com to it
#   through Traefik.

services:
  factorio:
    # The server version must match the game client version. Pin an
    # exact tag (for example 2.0.77) to control when the server updates.
    image: factoriotools/factorio:stable
    restart: unless-stopped
    ports:
      - "34197:34197/udp"
    volumes:
      - factorio-data:/factorio
    environment:
      # Load the newest save in /factorio/saves on each start. The
      # newest zip wins: delete throwaway saves so they cannot shadow
      # the real one.
      LOAD_LATEST_SAVE: "true"
      # The mods come from the volume. Do not pull mod updates on start.
      UPDATE_MODS_ON_START: "false"
      # The save does not use the Space Age DLC. This keeps the DLC
      # mods disabled in mod-list.json on every start.
      DLC_SPACE_AGE: "false"

  # Web file manager for the volume. Set FILES_PASSWORD in the Dokploy
  # Environment tab; the login is admin / that password. Do not use "$"
  # in the password - compose interpolation eats it.
  files:
    image: sigoden/dufs:latest
    restart: unless-stopped
    command: ["/data", "-A", "-a", "admin:${FILES_PASSWORD}@/:rw"]
    volumes:
      - factorio-data:/data

volumes:
  factorio-data:
